[project]
name = "rag-document-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rushabh Gandhi", email = "gandhirushabh11@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
rag-document-search = "rag_document_search.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
